name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo run -p stattic -- build examples/hello --output target/hello.stattic
      - run: cargo run -p stattic -- inspect target/hello.stattic
      - run: >-
          php -d disable_functions=proc_open,exec,shell_exec,system,passthru
          runtime/bin/admit.php
          --bundle target/hello.stattic
          --storage target/runtime-storage

  php-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - run: php -l runtime/bin/admit.php
      - run: php -d disable_functions=proc_open,exec,shell_exec,system,passthru runtime/tests/bundle-admission.php

  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:routing
      - run: bun run test:routing
      - run: bun run build:routing
