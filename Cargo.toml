[workspace]
members = [
  "crates/stattic-runtime-egress",
  "crates/stattic-runtime-compiler",
  "crates/stattic-runtime-core",
  "crates/stattic-runtime-policy",
  "crates/stattic-runtime-wasi",
  "crates/stattic-zero-runner",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
lol_html = "3.0.0"
mime_guess = "2"
pulldown-cmark = "0.13.4"
regex = "1"
serde_yaml = "0.9"
# PNG raster output only: no animation codecs, no rayon. `woff2` decodes the
# embedded default face (crates/stattic-zero-runner/assets/fonts). `svg-source`
# is not optional in practice — takumi-raster 0.4.13 fails to compile with the
# feature off (`RenderedImage`/`draw_image` are used outside their
# `#[cfg(feature = "svg")]` gates).
takumi = { version = "2.6.0", default-features = false, features = [
  "raster-backend",
  "svg-source",
  "woff2",
] }
unicode-normalization = "0.1"
url = "2"
walkdir = "2"

[profile.dev]
incremental = true

[profile.test]
incremental = true

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
