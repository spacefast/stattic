[package]
name = "spacefast-secret-scan"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Linear-time Rust secret scanner consuming gitleaks.toml rules with tiered severity and redaction."
repository = "https://github.com/spacefast/stattic"
keywords = ["secret-scanning", "gitleaks", "security", "regex", "wasm"]
categories = ["development-tools", "text-processing"]
publish = false

[features]
default = ["default-rules"]
default-rules = []

[dependencies]
aho-corasick = "1"
regex.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
