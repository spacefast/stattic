[package]
name = "stattic-runtime-core"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
lol_html.workspace = true
mime_guess.workspace = true
percent-encoding = "2"
pulldown-cmark.workspace = true
regex.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml.workspace = true
sha2 = "0.10"
unicode-normalization.workspace = true
url.workspace = true
walkdir.workspace = true
stattic-runtime-egress = { path = "../stattic-runtime-egress" }
stattic-runtime-policy = { path = "../stattic-runtime-policy" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
html5ever = "0.40.1"
html5gum = "0.9.1"
oxc_allocator = "=0.152.0"
oxc_parser = "=0.152.0"
oxc_ast = "=0.152.0"
oxc_ast_visit = "=0.152.0"
tree-sitter = "=0.26.3"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
oxc_span = "=0.152.0"
brotli = "8"
flate2 = "1"
zero = { path = "../zero", default-features = false, features = ["host"] }
stattic-zero-runner = { path = "../stattic-zero-runner" }

# utimensat(2), to stamp a placed file's mtime by path. std can only set times
# through an open File, and that open needs write access a read-only CAS blob
# does not grant — while opening retained blobs at all is exactly the cost the
# retained path exists to avoid.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
