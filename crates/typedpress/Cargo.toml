[package]
name = "typedpress"
version = "0.3.0"
edition = "2024"
# The compiler sources are MIT. The package also contains the GPL-2.0-or-later
# PHP runtime embedded by build.rs; LICENSE at the root maps every path.
license = "MIT AND GPL-2.0-or-later"
description = "Compiles typedpress.config.ts into a PHP backend: migrations, REST, auth, a typed client and WordPress plugins"
repository = "https://github.com/spacefast/zero"

[lib]
# rlib for the binary and the tests; cdylib for the browser build (src/wasm.rs).
crate-type = ["rlib", "cdylib"]

[dependencies]
imagesize = "0.15.0"
indexmap = "2.14.2"
oxc-css-parser = "0.0.22"
oxc_allocator = "=0.158.0"
oxc_ast = "=0.158.0"
oxc_ast_visit = "=0.158.0"
oxc_parser = "=0.158.0"
oxc_span = "=0.158.0"
oxc_syntax = "=0.158.0"
oxc_codegen = "=0.158.0"
oxc_isolated_declarations = { version = "=0.158.0", optional = true }
oxc_semantic = "=0.158.0"
oxc_transformer = "=0.158.0"
# Minifies the client modules the app plugin ships (src/minify.rs). Pinned with the other oxc crates.
oxc_minifier = "=0.158.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
regex = "1.13.1"
ryu-js = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = { version = "3.27.0", optional = true }
ureq = { version = "3.5.0", features = ["rustls"], optional = true }
url = "2.5.8"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"

# Validates the generated OpenAPI document, and real responses against it (tests/compiler.rs). Not
# for the browser target: the tests that use it run the `typedpress` binary, and its dependencies don't
# build for wasm32-unknown-unknown.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
boon = "0.6.1"

[features]
default = ["cli"]
# The commands: project I/O, plugin downloads, the embedded PHP runtime (build.rs).
host = ["dep:oxc_isolated_declarations"]
cli = ["host", "dep:tempfile", "dep:ureq", "dep:zip"]

# oxc_transformer reaches oxc-browserslist through oxc_compat; its wasm32 build imports js-sys and
# wasm-bindgen functions no TypedPress wasm host provides. TypedPress never resolves a browserslist query, so
# a crate with the same types and no queries stands in (crates/oxc-browserslist/Cargo.toml).
[patch.crates-io]
oxc-browserslist = { path = "crates/oxc-browserslist" }

[[bin]]
name = "typedpress"
required-features = ["cli"]

# Tests and dev builds keep line tables only (file and line in panics and backtraces, no variable
# info for a debugger). Each test target links the whole crate, and with full debuginfo the `rest`
# CI shard's target/ reached 7.4 GB, filling the runner's disk before its last steps. For a debugger
# session: CARGO_PROFILE_DEV_DEBUG=true cargo build.
[profile.dev]
debug = "line-tables-only"

# `strip` drops debug symbols from the release binary: 51.3 MB -> 47.4 MB. Thin LTO and one codegen
# unit were measured too (typedpress check and typedpress build on three examples, median of five): neither
# changed the times beyond run-to-run noise, and one codegen unit saved 1.8 MB for a release build
# more than twice as long, so neither is set.
[profile.release]
strip = true

# The browser build of the compiler core (src/wasm.rs; www/scripts/build-wasm.mjs runs this):
# `cargo build --lib --no-default-features --profile wasm --target wasm32-unknown-unknown`
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
