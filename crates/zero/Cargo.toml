[package]
name = "zero"
version = "0.3.0"
edition = "2024"
# The compiler sources are MIT. The package also contains the GPL-2.0-or-later
# PHP runtime embedded by build.rs; LICENSE at the root maps every path.
license = "MIT AND GPL-2.0-or-later"
description = "Compiles zero.config.ts into a PHP backend: migrations, REST, auth, a typed client and WordPress plugins"
repository = "https://github.com/spacefast/zero"

[lib]
# rlib for the binary and the tests; cdylib for the browser build (src/wasm.rs).
crate-type = ["rlib", "cdylib"]

[dependencies]
indexmap = "2.14.2"
oxc_allocator = "=0.152.0"
oxc_ast = "=0.152.0"
oxc_parser = "=0.152.0"
oxc_span = "=0.152.0"
oxc_syntax = "=0.152.0"
oxc_codegen = { version = "=0.152.0", optional = true }
oxc_isolated_declarations = { version = "=0.152.0", optional = true }
oxc_semantic = { version = "=0.152.0", optional = true }
oxc_transformer = { version = "=0.152.0", optional = true }
regex = "1.13.1"
ryu-js = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = { version = "3.27.0", optional = true }
ureq = { version = "3.5.0", features = ["rustls"], optional = true }
url = "2.5.8"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = ["cli"]
# The commands: project I/O, plugin downloads, the embedded PHP runtime (build.rs).
host = ["dep:oxc_codegen", "dep:oxc_isolated_declarations", "dep:oxc_semantic", "dep:oxc_transformer"]
cli = ["host", "dep:tempfile", "dep:ureq", "dep:zip"]

[[bin]]
name = "zero"
required-features = ["cli"]

# The browser build of the compiler core (src/wasm.rs; site/scripts/build-wasm.mjs runs this):
# `cargo build --lib --no-default-features --profile wasm --target wasm32-unknown-unknown`
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
